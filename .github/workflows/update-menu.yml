name: Update Clover Menu

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Scrape Clover menu
        run: |
          python scraper.py

      - name: Commit updated menu
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add menu.csv
          git commit -m "Auto-update menu from Clover" || echo "No changes to commit"
          git push
