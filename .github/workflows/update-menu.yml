name: Update Clover Menu
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
permissions:
  contents: write
jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies       # optional but saves ~30s
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install chromium

      - name: Scrape Clover menu
        run: python scraper.py        # fixed filename

      - name: Verify menu file exists     # safety net only
        run: |
          if [ ! -f menu.csv ]; then
            echo "menu.csv not found — scraper likely failed to fetch the page"
            exit 1
          fi

      - name: Commit updated menu
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add menu.csv
          git diff --cached --quiet || git commit -m "Auto-update menu from Clover"
          git push
