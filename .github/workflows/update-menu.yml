name: Update Clover Menu

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Scrape Clover menu
        run: |
          python scraper.py

      - name: Verify menu file exists
        run: |
          if [ ! -f menu.csv ]; then
            echo "menu.csv not found"
            exit 1
          fi

      - name: Verify menu file is not empty
        run: |
          if [ ! -s menu.csv ]; then
            echo "menu.csv is empty"
            exit 1
          fi

      - name: Commit updated menu
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add menu.csv

          git diff --cached --quiet || git commit -m "Auto-update menu from Clover"

          git push
